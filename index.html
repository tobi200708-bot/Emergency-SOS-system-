<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency SOS System</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #070b14;
            color: white;
            padding: 40px;
        }

        #qrcode {
            background: white;
            padding: 15px;
            width: 220px;
            margin: 30px auto;
        }

        button {
            padding: 15px 25px;
            background: red;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>🚨 Emergency SOS System</h1>

    <p>Scan QR Code to open Emergency SOS</p>

    <div id="qrcode"></div>

    <button onclick="createQR()">
        Generate QR Code
    </button>

    <!-- QR Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>

        // YOUR WEBSITE URL
        const websiteURL =
            "https://tobi200708-bot.github.io/Emergency-SOS-system-/";


        function createQR() {

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(
                document.getElementById("qrcode"),
                {
                    text: websiteURL,
                    width: 220,
                    height: 220
                }
            );
        }


        // Automatically create QR
        window.onload = function() {
            createQR();
        };

    </script>

</body>
</html>
