<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency SOS System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🚨 Emergency SOS System</h1>
    <p>Cloud Based Emergency Alert System</p>
</header>

<main>

    <!-- SOS CARD -->
    <section class="card">

        <h2>Emergency SOS</h2>

        <p id="status">
            System Ready
        </p>

        <button id="sosButton">
            🚨 SEND SOS
        </button>

        <p id="locationStatus">
            📍 Location: Waiting...
        </p>

        <a id="mapLink"
           href="#"
           target="_blank"
           style="display:none;">
            Open My Location
        </a>

    </section>


    <!-- QR CARD -->
    <section class="card">

        <h2>📱 QR Code</h2>

        <p>
            Scan this QR code to open the Emergency SOS System.
        </p>

        <div id="qrcode"></div>

        <button id="qrButton">
            Generate QR Code
        </button>

    </section>

</main>


<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- MAIN SCRIPT -->
<script type="module" src="script.js"></script>

</body>
</html>
